<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nepal Law Group</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Merriweather:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #545454;
            line-height: 1.5;
            scroll-behavior: smooth;
        }
        /* Initial full‑screen hero */
        .initial-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: #ffffff;
        }
        .initial-logo img {
            height: 240px;
            width: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.05));
            margin-bottom: 1rem;
        }
        .initial-brand-np {
            font-family: 'Merriweather', serif;
            font-size: 3rem;
            font-weight: 800;
            color: #545454;
            margin-bottom: 0.5rem;
        }
        .initial-brand-en {
            font-family: 'Merriweather', serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #545454;
            margin-bottom: 2rem;
        }
        .initial-lang {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            background: #e9ecef; /* light grey background */
            padding: 0.3rem;
            border-radius: 60px;
            width: fit-content;
            margin: 0 auto;
        }
        .lang-btn {
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            color: #545454;
        }
        .lang-btn:hover {
            background: #d6a12f;
            color: #ffffff;
        }
        /* Header (shown after language selection) */
        .site-header {
            background: #ffffff;
            padding: 1rem 0;
            border-bottom: 1px solid #d6a12f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }
        .logo-small {
            height: 50px;
            width: auto;
        }
        .brand-name {
            font-family: 'Merriweather', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #545454;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #545454;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #d6a12f;
            border-bottom-color: #d6a12f;
        }
        .main-content {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 24px;
        }
        .callout {
            background: #f8f6f0;
            border-left: 6px solid #d6a12f;
            padding: 2rem;
            margin: 2rem 0;
        }
        .callout h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: #545454;
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            background: #d6a12f;
            color: white;
            padding: 0.6rem 1.2rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover { background: #b8891a; }
        .section { margin: 3rem 0; }
        .section h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: #545454;
            border-left: 4px solid #d6a12f;
            padding-left: 1rem;
            margin-bottom: 1rem;
        }
        .section p { color: #3c3c3c; margin-bottom: 1rem; }
        .footer {
            background: #f8f6f0;
            padding: 2rem 0;
            border-top: 1px solid #d6a12f;
            text-align: center;
        }
        .footer-policy {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .footer-policy a {
            color: #545454;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .footer-policy a:hover { color: #d6a12f; }
        @media (max-width: 700px) {
            .initial-brand-np { font-size: 2rem; }
            .initial-brand-en { font-size: 1.8rem; }
            .initial-logo img { height: 140px; }
            .logo-small { height: 40px; }
            .brand-name { font-size: 1.1rem; }
            .nav-links { gap: 1rem; }
            .callout h2 { font-size: 1.3rem; }
            .section h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<!-- Initial screen (visible before language selection) -->
<div id="initialScreen" class="initial-hero">
    <div class="initial-logo">
        <img src="/images/logo.png" alt="Nepal Law Group Logo">
    </div>
    <div class="initial-brand-np">नेपाल ल ग्रुप</div>
    <div class="initial-brand-en">Nepal Law Group</div>
    <div class="initial-lang">
        <button class="lang-btn" id="initialLangEn">English</button>
        <button class="lang-btn" id="initialLangNp">नेपाली</button>
    </div>
</div>

<!-- Main site structure (hidden initially) -->
<div id="mainSite" style="display: none;">
    <header class="site-header">
        <div class="header-inner">
            <div class="logo-area" id="resetButton">
                <img src="/images/logo.png" alt="Logo" class="logo-small">
                <span class="brand-name" id="headerBrand">Nepal Law Group</span>
            </div>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </header>
    <div class="main-content" id="mainContent"></div>
    <footer class="footer">
        <div class="footer-policy">
            <a href="terms.html" id="termsLink">Terms of Use</a>
            <a href="privacy.html" id="privacyLink">Privacy Policy</a>
            <a href="cookie.html" id="cookieLink">Cookie Policy</a>
        </div>
        <div id="footerText">© 2026 Nepal Law Group – All rights reserved.</div>
    </footer>
</div>

<script>
    const content = {
        en: {
            headerBrand: "Nepal Law Group",
            navHome: "Home", navAbout: "About", navMembership: "Membership", navContact: "Contact",
            ctaTitle: "Call for Founder Members – Be a Founder",
            ctaText: "We are now inviting legally qualified individuals and professionals who share our vision to join as Founder Members. Founder Members will have the unique honour of shaping the company’s governance, policies, and strategic direction from the very beginning.",
            ctaExtra: "If you believe that legal practice can be independent, ethical, and knowledge‑driven – and that a collective of members can advance law beyond individual gain – we invite you to become a Founder Member today.",
            ctaBtn: "Learn more →",
            visionTitle: "Our Vision",
            visionText: "To evolve into a nationally esteemed institutional platform that advances the rule of law, legal scholarship, and professional integrity – while ensuring that every member both contributes to and benefits from a culture of excellence.",
            missionTitle: "Our Mission",
            missionText: "To create a self‑sustaining legal community wherein practising advocates, legal researchers, academics, and publishers collaborate synergistically. The Group shall distribute no profit; its entire revenue (derived exclusively from membership fees) will be reinvested into legal research, academic programmes, publications, and institutional development.",
            footerText: "© 2026 Nepal Law Group – All rights reserved.",
            termsText: "Terms of Use", privacyText: "Privacy Policy", cookieText: "Cookie Policy"
        },
        np: {
            headerBrand: "नेपाल ल ग्रुप",
            navHome: "गृह पृष्ठ", navAbout: "बारेमा", navMembership: "सदस्यता", navContact: "सम्पर्क",
            ctaTitle: "संस्थापक सदस्यको आह्वान – संस्थापक बन्नुहोस्",
            ctaText: "कम्पनी अहिलेसम्म दर्ता भएको छैन। हामी अहिले कानूनी क्षेत्रका योग्य व्यक्ति तथा व्यवसायीहरूलाई संस्थापक सदस्य का रूपमा सामेल हुन आमन्त्रण गर्दछौँ। संस्थापक सदस्यहरूले कम्पनीको सुशासन, नीति तथा रणनीतिक दिशा निर्धारण गर्ने अवसर पाउनेछन्।",
            ctaExtra: "यदि तपाईं स्वतन्त्र, नैतिक र ज्ञान–संचालित कानूनी अभ्यासमा विश्वास राख्नुहुन्छ भने, आजै संस्थापक सदस्य बन्नुहोस्।",
            ctaBtn: "थप जान्नुहोस् →",
            visionTitle: "हाम्रो सोच",
            visionText: "राष्ट्रियस्तरमा सम्मानित संस्थाको रूपमा विकसित हुने, जसले कानूनको शासन, कानूनी विद्वत्ता र व्यावसायिक इमानदारीलाई अगाडि बढाउँछ – र जहाँ प्रत्येक सदस्यको योगदान र लाभ उत्कृष्टताको संस्कृतिभित्र सुनिश्चित हुन्छ।",
            missionTitle: "हाम्रो लक्ष्य",
            missionText: "एक आत्मनिर्भर कानूनी समुदायको स्थापना गर्ने, जहाँ अभ्यासरत अधिवक्ता, कानूनी अनुसन्धानकर्ता, शिक्षाविद् र प्रकाशकहरूले सहकार्य गर्छन्। समूहले कुनै मुनाफा वितरण गर्दैन; यसको सम्पूर्ण आम्दानी (केवल सदस्यता शुल्कबाट) कानूनी अनुसन्धान, शैक्षिक कार्यक्रम, प्रकाशन र संस्थागत विकासमा पुनः लगानी गरिनेछ।",
            footerText: "© २०८३ नेपाल ल ग्रुप – सबै अधिकार सुरक्षित",
            termsText: "प्रयोगका सर्तहरू", privacyText: "गोपनीयता नीति", cookieText: "कुकी नीति"
        }
    };

    function loadSite(lang) {
        const d = content[lang];
        document.getElementById("headerBrand").innerText = d.headerBrand;
        const navContainer = document.getElementById("navLinks");
        navContainer.innerHTML = `
            <a href="index.html">${d.navHome}</a>
            <a href="about.html">${d.navAbout}</a>
            <a href="membership.html">${d.navMembership}</a>
            <a href="contact.html">${d.navContact}</a>
        `;
        document.querySelectorAll("#navLinks a").forEach(link => {
            if (link.getAttribute("href") === "index.html") link.classList.add("active");
            else link.classList.remove("active");
        });
        const mainDiv = document.getElementById("mainContent");
        mainDiv.innerHTML = `
            <div class="callout">
                <h2>${d.ctaTitle}</h2>
                <p>${d.ctaText}</p>
                <p>${d.ctaExtra}</p>
                <a href="membership.html" class="btn">${d.ctaBtn}</a>
            </div>
            <div class="section">
                <h2>${d.visionTitle}</h2>
                <p>${d.visionText}</p>
            </div>
            <div class="section">
                <h2>${d.missionTitle}</h2>
                <p>${d.missionText}</p>
            </div>
        `;
        document.getElementById("termsLink").innerText = d.termsText;
        document.getElementById("privacyLink").innerText = d.privacyText;
        document.getElementById("cookieLink").innerText = d.cookieText;
        document.getElementById("footerText").innerHTML = d.footerText;
        localStorage.setItem("nlgLang", lang);
        document.getElementById("initialScreen").style.display = "none";
        document.getElementById("mainSite").style.display = "block";
    }

    function resetToInitial() {
        localStorage.removeItem("nlgLang");
        document.getElementById("mainSite").style.display = "none";
        document.getElementById("initialScreen").style.display = "flex";
    }

    document.getElementById("initialLangEn").addEventListener("click", () => loadSite("en"));
    document.getElementById("initialLangNp").addEventListener("click", () => loadSite("np"));
    document.getElementById("resetButton").addEventListener("click", resetToInitial);

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("reset")) {
        resetToInitial();
    } else {
        const storedLang = localStorage.getItem("nlgLang");
        if (storedLang && (storedLang === "en" || storedLang === "np")) {
            loadSite(storedLang);
        }
    }
</script>
</body>
</html>
