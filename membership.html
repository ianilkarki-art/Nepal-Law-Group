<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nepal Law Group – Membership</title>
    <meta name="description" content="Become a Founder Member of Nepal Law Group. Learn about eligibility, requirements, and benefits. Join a membership‑driven, non‑profit legal institution in Nepal.">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Merriweather:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #545454;
            line-height: 1.5;
            scroll-behavior: smooth;
        }
        .site-header {
            background: #ffffff;
            padding: 1rem 0;
            border-bottom: 1px solid #d6a12f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .logo-small {
            height: 50px;
            width: auto;
        }
        .brand-name {
            font-family: 'Merriweather', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #545454;
            text-decoration: none;
        }
        /* Desktop navigation */
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #545454;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #d6a12f;
            border-bottom-color: #d6a12f;
        }
        /* Hamburger button (hidden on desktop) */
        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            z-index: 101;
        }
        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: #545454;
            margin: 5px 0;
            transition: 0.2s;
            border-radius: 2px;
        }
        /* Mobile menu overlay */
        .mobile-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .mobile-menu.active {
            visibility: visible;
            opacity: 1;
        }
        .mobile-nav {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }
        .mobile-nav a {
            color: #545454;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: color 0.2s;
        }
        .mobile-nav a:hover, .mobile-nav a.active {
            color: #d6a12f;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .hamburger {
                display: block;
            }
            .brand-name {
                font-size: 1.2rem;
            }
            .logo-small {
                height: 40px;
            }
        }
        .main-content {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 24px;
        }
        .section { margin: 3rem 0; }
        .section h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: #545454;
            border-left: 4px solid #d6a12f;
            padding-left: 1rem;
            margin-bottom: 1rem;
        }
        .section p { color: #3c3c3c; margin-bottom: 1rem; }
        .btn {
            display: inline-block;
            background: #d6a12f;
            color: white;
            padding: 0.6rem 1.2rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover { background: #b8891a; }
        .footer {
            background: #f8f6f0;
            padding: 2rem 0;
            border-top: 1px solid #d6a12f;
            text-align: center;
        }
        .footer-policy {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .footer-policy a {
            color: #545454;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-policy a:hover {
            color: #d6a12f;
        }
        .footer-copyright {
            font-size: 0.8rem;
            color: #6b7b8c;
            margin-top: 0.5rem;
        }
        @media (max-width: 700px) {
            .footer-policy a { font-size: 0.85rem; }
            .section h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html?reset=1" class="logo-area">
            <img src="/images/logo.png" alt="Logo" class="logo-small">
            <span class="brand-name" id="headerBrand">Nepal Law Group</span>
        </a>
        <!-- Desktop navigation -->
        <div class="nav-links" id="navLinks"></div>
        <!-- Hamburger button for mobile -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>

<!-- Mobile dropdown overlay -->
<div class="mobile-menu" id="mobileMenu">
    <div class="mobile-nav" id="mobileNav"></div>
</div>

<div class="main-content" id="mainContent"></div>

<footer class="footer">
    <div class="footer-policy">
        <a href="terms.html" id="termsLink">Terms of Use</a>
        <a href="privacy.html" id="privacyLink">Privacy Policy</a>
        <a href="cookie.html" id="cookieLink">Cookie Policy</a>
    </div>
    <div class="footer-copyright" id="footerText">© 2026 Nepal Law Group – All rights reserved.</div>
</footer>

<script>
    const content = {
        en: {
            headerBrand: "Nepal Law Group",
            navHome: "Home", navAbout: "About", navMembership: "Membership", navContact: "Contact",
            inviteText: "We invite legally qualified individuals who share our vision of independent, ethical, and knowledge‑driven legal practice to join as Founder Members.",
            eligTitle: "Eligibility",
            eligText: "Legal qualifications – such as being an advocate, legal scholar, researcher, or legally trained professional – are strongly preferred, though other professionals who can contribute to the company’s mission may also be considered.",
            reqTitle: "Requirements",
            reqText: "Founder Members must pay the prescribed founder membership fee (currently nominal, set to cover only the initial registration and documentation costs). They are expected to actively participate in the first general meeting, contribute to the formulation of the company’s initial rules and code of conduct, and uphold the company’s ethical and professional standards. They must renew their membership annually as per the rules, unless they opt for lifetime membership. Founder Members also bear a duty to promote the company’s objectives and to act in a manner that does not bring the institution into disrepute.",
            whyTitle: "Why Join as a Founder Member?",
            whyText: "By becoming a Founder Member, you will help create an institution that places legal knowledge and public service above commercial profit. You will be a founder of Nepal’s first membership‑driven, non‑profit law group – an institution designed to advance the rule of law, legal scholarship, and professional integrity for generations to come.",
            ctaBtn: "Express Interest →",
            footerText: "© 2026 Nepal Law Group – All rights reserved.",
            termsText: "Terms of Use", privacyText: "Privacy Policy", cookieText: "Cookie Policy"
        },
        np: {
            headerBrand: "नेपाल ल ग्रुप",
            navHome: "गृह पृष्ठ", navAbout: "बारेमा", navMembership: "सदस्यता", navContact: "सम्पर्क",
            inviteText: "हामी स्वतन्त्र, नैतिक र ज्ञान–संचालित कानूनी अभ्यासमा विश्वास राख्ने कानूनी क्षेत्रका योग्य व्यक्तिहरूलाई संस्थापक सदस्य का रूपमा सामेल हुन आमन्त्रण गर्दछौँ।",
            eligTitle: "योग्यता",
            eligText: "कानूनी योग्यता, जस्तै अधिवक्ता, कानूनी विद्वान्, अनुसन्धानकर्ता वा कानूनमा प्रशिक्षित पेशाकर्मी भएको व्यक्तिलाई प्राथमिकता दिइनेछ, यद्यपि कम्पनीको मिसनमा योगदान दिन सक्ने अन्य पेशाकर्मीलाई पनि विचार गर्न सकिन्छ।",
            reqTitle: "आवश्यकताहरू",
            reqText: "संस्थापक सदस्यहरूले निर्धारित संस्थापक सदस्य शुल्क तिर्नुपर्छ (हाल प्रारम्भिक दर्ता र कागजात लागत मात्र समेट्ने नगण्य रकम राखिएको छ)। उनीहरूले पहिलो साधारण सभामा सक्रिय रूपमा सहभागी हुने, कम्पनीको प्रारम्भिक नियम र आचारसंहिता निर्माणमा योगदान दिने, र कम्पनीको नैतिक तथा व्यावसायिक मापदण्डहरू पालना गर्ने अपेक्षा गरिन्छ। उनीहरूले नियमानुसार वार्षिक रूपमा सदस्यता नवीकरण गर्नुपर्छ (जबसम्म आजीवन सदस्यता नरोजेको हो)। संस्थापक सदस्यहरूले कम्पनीको उद्देश्यहरू प्रवर्द्धन गर्न र संस्थाको प्रतिष्ठामा आँच नआउने गरी कार्य गर्ने दायित्व पनि बोक्छन्।",
            whyTitle: "संस्थापक सदस्य किन बन्ने?",
            whyText: "संस्थापक सदस्य बनेर, तपाईंले एउटा यस्तो संस्था सिर्जना गर्न मद्दत गर्नुहुनेछ जसले कानूनी ज्ञान र सार्वजनिक सेवालाई व्यावसायिक नाफाभन्दा माथि राख्छ। तपाईं नेपालको पहिलो सदस्यता–संचालित, गैर-नाफामुखी कानूनी समूहको संस्थापक हुनुहुनेछ – एउटा यस्तो संस्था जसले आउने पुस्ताहरूका लागि कानूनको शासन, कानूनी विद्वत्ता र व्यावसायिक इमानदारीलाई अगाडि बढाउने योजना बनाइएको छ।",
            ctaBtn: "रुचि व्यक्त गर्नुहोस् →",
            footerText: "© २०८३ नेपाल ल ग्रुप – सबै अधिकार सुरक्षित",
            termsText: "प्रयोगका सर्तहरू", privacyText: "गोपनीयता नीति", cookieText: "कुकी नीति"
        }
    };

    let currentLang = localStorage.getItem("nlgLang") || "en";
    let mobileMenuOpen = false;

    function updateUI(lang) {
        const d = content[lang];
        document.getElementById("headerBrand").innerText = d.headerBrand;
        // Desktop nav
        const navContainer = document.getElementById("navLinks");
        navContainer.innerHTML = `
            <a href="index.html?reset=1">${d.navHome}</a>
            <a href="about.html">${d.navAbout}</a>
            <a href="membership.html" class="active">${d.navMembership}</a>
            <a href="contact.html">${d.navContact}</a>
        `;
        // Mobile nav
        const mobileNavContainer = document.getElementById("mobileNav");
        mobileNavContainer.innerHTML = `
            <a href="index.html?reset=1">${d.navHome}</a>
            <a href="about.html">${d.navAbout}</a>
            <a href="membership.html" class="active">${d.navMembership}</a>
            <a href="contact.html">${d.navContact}</a>
        `;
        document.getElementById("termsLink").innerText = d.termsText;
        document.getElementById("privacyLink").innerText = d.privacyText;
        document.getElementById("cookieLink").innerText = d.cookieText;
        document.getElementById("footerText").innerHTML = d.footerText;

        const mainDiv = document.getElementById("mainContent");
        mainDiv.innerHTML = `
            <div class="section">
                <p>${d.inviteText}</p>
            </div>
            <div class="section">
                <h2>${d.eligTitle}</h2>
                <p>${d.eligText}</p>
            </div>
            <div class="section">
                <h2>${d.reqTitle}</h2>
                <p>${d.reqText}</p>
            </div>
            <div class="section">
                <h2>${d.whyTitle}</h2>
                <p>${d.whyText}</p>
                <p><a href="contact.html" class="btn">${d.ctaBtn}</a></p>
            </div>
        `;
        localStorage.setItem("nlgLang", lang);
    }

    // Mobile menu toggle
    const hamburger = document.getElementById("hamburgerBtn");
    const mobileMenu = document.getElementById("mobileMenu");
    function toggleMobileMenu() {
        if (mobileMenuOpen) {
            mobileMenu.classList.remove("active");
        } else {
            mobileMenu.classList.add("active");
        }
        mobileMenuOpen = !mobileMenuOpen;
    }
    mobileMenu.addEventListener("click", (e) => {
        if (e.target.tagName === "A") {
            toggleMobileMenu();
        }
    });
    mobileMenu.addEventListener("click", (e) => {
        if (e.target === mobileMenu) {
            toggleMobileMenu();
        }
    });
    hamburger.addEventListener("click", toggleMobileMenu);

    updateUI(currentLang);
</script>
</body>
</html>
