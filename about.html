<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nepal Law Group – About</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Merriweather:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #545454;
            line-height: 1.5;
            scroll-behavior: smooth;
        }
        .site-header {
            background: #ffffff;
            padding: 1rem 0;
            border-bottom: 1px solid #d6a12f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .logo-small {
            height: 50px;
            width: auto;
        }
        .brand-name {
            font-family: 'Merriweather', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #545454;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #545454;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #d6a12f;
            border-bottom-color: #d6a12f;
        }
        .main-content {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 24px;
        }
        .section { margin: 3rem 0; }
        .section h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: #545454;
            border-left: 4px solid #d6a12f;
            padding-left: 1rem;
            margin-bottom: 1rem;
        }
        .section p { color: #3c3c3c; margin-bottom: 1rem; }
        .section ul { margin-left: 2rem; color: #3c3c3c; }
        .footer {
            background: #f8f6f0;
            padding: 2rem 0;
            border-top: 1px solid #d6a12f;
            text-align: center;
        }
        .footer-policy {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .footer-policy a {
            color: #545454;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .footer-policy a:hover { color: #d6a12f; }
        @media (max-width: 700px) {
            .logo-small { height: 40px; }
            .brand-name { font-size: 1.1rem; }
            .nav-links { gap: 1rem; }
            .section h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html?reset=1" class="logo-area">
            <img src="/images/logo.png" alt="Logo" class="logo-small">
            <span class="brand-name" id="headerBrand">Nepal Law Group</span>
        </a>
        <div class="nav-links" id="navLinks"></div>
    </div>
</header>

<div class="main-content" id="mainContent"></div>

<footer class="footer">
    <div class="footer-policy">
        <a href="terms.html" id="termsLink">Terms of Use</a>
        <a href="privacy.html" id="privacyLink">Privacy Policy</a>
        <a href="cookie.html" id="cookieLink">Cookie Policy</a>
    </div>
    <div id="footerText">© 2026 Nepal Law Group – All rights reserved.</div>
</footer>

<script>
    const content = {
        en: {
            headerBrand: "Nepal Law Group",
            navHome: "Home", navAbout: "About", navMembership: "Membership", navContact: "Contact",
            visionTitle: "Our Vision",
            visionText: "To evolve into a nationally esteemed institutional platform that advances the rule of law, legal scholarship, and professional integrity – while ensuring that every member both contributes to and benefits from a culture of excellence.",
            missionTitle: "Our Mission",
            missionText: "To create a self‑sustaining legal community wherein practising advocates, legal researchers, academics, and publishers collaborate synergistically. The Group shall distribute no profit; its entire revenue (derived exclusively from membership fees) will be reinvested into legal research, academic programmes, publications, and institutional development.",
            foundationTitle: "Our Foundation",
            foundationText: "The Group’s activities will be strictly service‑oriented, non‑profit, educational, academic, social, charitable, and of public utility. This foundational character is embedded in the Group’s proposed Memorandum of Association, which prohibits the distribution of any surplus to members and mandates that all revenue be applied solely toward the achievement of its stated objects.",
            objectivesTitle: "Our Objectives",
            objectivesSub: "The company has identified four priority objectives that will receive the highest attention and resources:",
            objectives: [
                "(a) To carry out legal activities in accordance with the social needs, including the effective and efficient administration of justice and the clarification and simplification of the law",
                "(b) To conduct legal research and experimental development, as well as professional, scientific and technical activities, while encouraging scholarly and scientific legal work",
                "(c) To carry out activities to support campuses, institutes, universities and other educational programs that provide higher legal education and training programs",
                "(d) To carry out activities related to publishing legal books, journals and other publications"
            ],
            effortsTitle: "Our Efforts",
            effortsText: "We endeavour to elevate legal excellence across Nepal through structured collaboration, interdisciplinary networking, and the continuous sharing of legal knowledge. This includes the establishment of legal aid clinics, the organisation of annual colloquia on emerging areas of law, the development of open‑access digital repositories of Nepalese jurisprudence, and the cultivation of partnerships with academic institutions both within Nepal and abroad.",
            footerText: "© 2026 Nepal Law Group – All rights reserved.",
            termsText: "Terms of Use", privacyText: "Privacy Policy", cookieText: "Cookie Policy"
        },
        np: {
            headerBrand: "नेपाल ल ग्रुप",
            navHome: "गृह पृष्ठ", navAbout: "बारेमा", navMembership: "सदस्यता", navContact: "सम्पर्क",
            visionTitle: "हाम्रो सोच",
            visionText: "राष्ट्रियस्तरमा सम्मानित संस्थाको रूपमा विकसित हुने, जसले कानूनको शासन, कानूनी विद्वत्ता र व्यावसायिक इमानदारीलाई अगाडि बढाउँछ – र जहाँ प्रत्येक सदस्यको योगदान र लाभ उत्कृष्टताको संस्कृतिभित्र सुनिश्चित हुन्छ।",
            missionTitle: "हाम्रो लक्ष्य",
            missionText: "एक आत्मनिर्भर कानूनी समुदायको स्थापना गर्ने, जहाँ अभ्यासरत अधिवक्ता, कानूनी अनुसन्धानकर्ता, शिक्षाविद् र प्रकाशकहरूले सहकार्य गर्छन्। समूहले कुनै मुनाफा वितरण गर्दैन; यसको सम्पूर्ण आम्दानी (केवल सदस्यता शुल्कबाट) कानूनी अनुसन्धान, शैक्षिक कार्यक्रम, प्रकाशन र संस्थागत विकासमा पुनः लगानी गरिनेछ।",
            foundationTitle: "हाम्रो आधार",
            foundationText: "कम्पनीको व्यवसाय सेवामूलक, गैर-नाफामुखी, शैक्षिक, प्राज्ञिक, सामाजिक, परोपकारी र सार्वजनिक उपयोगिताको हुनेछ। यो आधारभूत चरित्र समूहको प्रस्तावित प्रबन्धपत्रमा समावेश गरिएको छ, जसले सदस्यहरूबीच कुनै पनि अधिशेषको वितरणलाई निषेध गर्दछ।",
            objectivesTitle: "हाम्रा उद्देश्यहरू",
            objectivesSub: "कम्पनीले चार प्राथमिकताका उद्देश्यहरू पहिचान गरेको छ जसलाई उच्चतम ध्यान र स्रोतहरू प्राप्त हुनेछन्:",
            objectives: [
                "(क) न्यायको प्रभावकारी र कुशल प्रशासन तथा कानूनको स्पष्टीकरण र सरलीकरणको साथै सामाजिक आवश्यकताहरू अनुरूप कानूनी क्रियाकलापहरू गर्ने",
                "(ख) विद्वत्तापूर्ण र वैज्ञानिक कानूनी कार्यलाई प्रोत्साहन गर्दै कानूनी अनुसन्धान सञ्चालन एवम् प्रयोगात्मक विकासको साथै पेशागत तथा वैज्ञानिक र प्राविधिक क्रियाकलापहरू गर्ने",
                "(ग) उच्च कानूनी शिक्षा तथा प्रशिक्षण कार्यक्रमहरूको सञ्चालन, प्रदान गर्ने क्याम्पस, इन्स्टिच्युट, विश्वविद्यालय सम्बन्धी र अन्य शैक्षिक कार्यक्रमहरूलाई सहयोग पुर्याउने क्रियाकलापहरू गर्ने",
                "(घ) कानूनी पुस्तकहरू, जर्नलहरूको प्रकाशन तथा अन्य प्रकाशनसम्बन्धी क्रियाकलापहरू गर्ने"
            ],
            effortsTitle: "हाम्रा प्रयासहरू",
            effortsText: "हामी सहकार्य र नेटवर्किङ मार्फत नेपालभरि कानुनी उत्कृष्टता बढाउने लक्ष्य राख्छौं। यसमा कानूनी सहायता क्लिनिकको स्थापना, कानूनका उदीयमान क्षेत्रहरूमा वार्षिक गोष्ठीहरूको आयोजना, नेपाली न्यायिक नजिरहरूको खुला पहुँच डिजिटल भण्डारको विकास, र शैक्षिक संस्थाहरूसँग साझेदारीको खेती समावेश छ।",
            footerText: "© २०८३ नेपाल ल ग्रुप – सबै अधिकार सुरक्षित",
            termsText: "प्रयोगका सर्तहरू", privacyText: "गोपनीयता नीति", cookieText: "कुकी नीति"
        }
    };

    let currentLang = localStorage.getItem("nlgLang") || "en";

    function renderObjectives(lang) {
        const list = document.getElementById("objectivesList");
        const objectives = content[lang].objectives;
        list.innerHTML = objectives.map(obj => `<li>${obj}</li>`).join("");
    }

    function updateUI(lang) {
        const d = content[lang];
        document.getElementById("headerBrand").innerText = d.headerBrand;
        const navContainer = document.getElementById("navLinks");
        navContainer.innerHTML = `
            <a href="index.html">${d.navHome}</a>
            <a href="about.html" class="active">${d.navAbout}</a>
            <a href="membership.html">${d.navMembership}</a>
            <a href="contact.html">${d.navContact}</a>
        `;
        document.getElementById("termsLink").innerText = d.termsText;
        document.getElementById("privacyLink").innerText = d.privacyText;
        document.getElementById("cookieLink").innerText = d.cookieText;
        document.getElementById("footerText").innerHTML = d.footerText;

        const mainDiv = document.getElementById("mainContent");
        mainDiv.innerHTML = `
            <div class="section">
                <h2>${d.visionTitle}</h2>
                <p>${d.visionText}</p>
            </div>
            <div class="section">
                <h2>${d.missionTitle}</h2>
                <p>${d.missionText}</p>
            </div>
            <div class="section">
                <h2>${d.foundationTitle}</h2>
                <p>${d.foundationText}</p>
            </div>
            <div class="section">
                <h2>${d.objectivesTitle}</h2>
                <p>${d.objectivesSub}</p>
                <ul id="objectivesList"></ul>
            </div>
            <div class="section">
                <h2>${d.effortsTitle}</h2>
                <p>${d.effortsText}</p>
            </div>
        `;
        renderObjectives(lang);
        localStorage.setItem("nlgLang", lang);
    }

    updateUI(currentLang);
</script>
</body>
</html>
