<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nepal Law Group – Contact</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* same as about.html (colours updated) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #d9d9d9;
            color: #545454;
            line-height: 1.5;
            scroll-behavior: smooth;
        }
        .site-header {
            background: #d9d9d9;
            padding: 1rem 0;
            border-bottom: 1px solid #be8c10;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .logo-small {
            height: 50px;
            width: auto;
        }
        .brand-name {
            font-family: 'Merriweather', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #545454;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #545454;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #be8c10;
            border-bottom-color: #be8c10;
        }
        .main-content {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 24px;
        }
        .contact-card {
            background: #ffffff;
            border-left: 6px solid #be8c10;
            padding: 2rem;
            margin: 2rem 0;
            text-align: center;
        }
        .contact-email {
            font-size: 1.3rem;
            font-weight: 600;
            color: #545454;
            margin: 1rem 0;
            word-break: break-all;
        }
        .note-text {
            color: #6b7b8c;
            font-size: 0.9rem;
            margin-top: 1rem;
            font-style: italic;
        }
        .footer {
            background: #d9d9d9;
            padding: 2rem 0;
            border-top: 1px solid #be8c10;
            text-align: center;
        }
        .footer-policy {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .footer-policy a {
            color: #545454;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .footer-policy a:hover { color: #be8c10; }
        @media (max-width: 700px) {
            .logo-small { height: 40px; }
            .brand-name { font-size: 1.1rem; }
            .nav-links { gap: 1rem; }
            .contact-email { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <div class="logo-area">
            <img src="/images/logo.png" alt="Logo" class="logo-small">
            <span class="brand-name" id="headerBrand">Nepal Law Group</span>
        </div>
        <div class="nav-links" id="navLinks"></div>
    </div>
</header>

<div class="main-content" id="mainContent"></div>

<footer class="footer">
    <div class="footer-policy">
        <a href="terms.html" id="termsLink">Terms of Use</a>
        <a href="privacy.html" id="privacyLink">Privacy Policy</a>
        <a href="cookie.html" id="cookieLink">Cookie Policy</a>
    </div>
    <div id="footerText">© 2026 Nepal Law Group – All rights reserved.</div>
</footer>

<script>
    const content = {
        en: {
            headerBrand: "Nepal Law Group",
            navHome: "Home", navAbout: "About", navMembership: "Membership", navContact: "Contact",
            inquiryText: "For all inquiries, including founder membership applications, please write to:",
            email: "contact@nepallawgroup.org",
            noteText: "Please note: The company does not yet have a physical office. All communication is currently by email.",
            footerText: "© 2026 Nepal Law Group – All rights reserved.",
            termsText: "Terms of Use", privacyText: "Privacy Policy", cookieText: "Cookie Policy"
        },
        np: {
            headerBrand: "नेपाल ल ग्रुप",
            navHome: "गृह पृष्ठ", navAbout: "बारेमा", navMembership: "सदस्यता", navContact: "सम्पर्क",
            inquiryText: "कुनै पनि प्रश्न, सुझाव वा संस्थापक सदस्य आवेदनको लागि कृपया इमेल लेख्नुहोस्:",
            email: "contact@nepallawgroup.org",
            noteText: "नोट: हाल कम्पनीको कुनै भौतिक कार्यालय छैन। सबै सञ्चार इमेलमार्फत हुनेछ।",
            footerText: "© २०८३ नेपाल ल ग्रुप – सबै अधिकार सुरक्षित",
            termsText: "प्रयोगका सर्तहरू", privacyText: "गोपनीयता नीति", cookieText: "कुकी नीति"
        }
    };

    let currentLang = localStorage.getItem("nlgLang") || "en";

    function updateUI(lang) {
        const d = content[lang];
        document.getElementById("headerBrand").innerText = d.headerBrand;
        const navContainer = document.getElementById("navLinks");
        navContainer.innerHTML = `
            <a href="index.html">${d.navHome}</a>
            <a href="about.html">${d.navAbout}</a>
            <a href="membership.html">${d.navMembership}</a>
            <a href="contact.html" class="active">${d.navContact}</a>
        `;
        document.getElementById("termsLink").innerText = d.termsText;
        document.getElementById("privacyLink").innerText = d.privacyText;
        document.getElementById("cookieLink").innerText = d.cookieText;
        document.getElementById("footerText").innerHTML = d.footerText;

        const mainDiv = document.getElementById("mainContent");
        mainDiv.innerHTML = `
            <div class="contact-card">
                <p>${d.inquiryText}</p>
                <div class="contact-email">${d.email}</div>
                <p class="note-text">${d.noteText}</p>
            </div>
        `;
        localStorage.setItem("nlgLang", lang);
    }

    updateUI(currentLang);
</script>
</body>
</html>
