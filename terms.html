<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nepal Law Group – Terms of Use</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Merriweather:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #545454;
            line-height: 1.5;
            scroll-behavior: smooth;
        }
        .site-header {
            background: #ffffff;
            padding: 1rem 0;
            border-bottom: 1px solid #d6a12f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .logo-small {
            height: 50px;
            width: auto;
        }
        .brand-name {
            font-family: 'Merriweather', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #545454;
            text-decoration: none;
        }
        /* Desktop navigation */
        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #545454;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #d6a12f;
            border-bottom-color: #d6a12f;
        }
        /* Hamburger button (hidden on desktop) */
        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            z-index: 101;
        }
        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: #545454;
            margin: 5px 0;
            transition: 0.2s;
            border-radius: 2px;
        }
        /* Mobile menu overlay */
        .mobile-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .mobile-menu.active {
            visibility: visible;
            opacity: 1;
        }
        .mobile-nav {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }
        .mobile-nav a {
            color: #545454;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: color 0.2s;
        }
        .mobile-nav a:hover, .mobile-nav a.active {
            color: #d6a12f;
        }
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .hamburger {
                display: block;
            }
            .brand-name {
                font-size: 1.2rem;
            }
            .logo-small {
                height: 40px;
            }
        }
        .main-content {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 24px;
        }
        .policy-content {
            background: #ffffff;
            padding: 1rem 0;
        }
        .policy-content h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: #545454;
            margin: 1.5rem 0 0.5rem;
            border-left: 4px solid #d6a12f;
            padding-left: 1rem;
        }
        .policy-content p {
            color: #3c3c3c;
            margin-bottom: 1rem;
        }
        .policy-content ul {
            margin-left: 2rem;
            color: #3c3c3c;
        }
        .footer {
            background: #f8f6f0;
            padding: 2rem 0;
            border-top: 1px solid #d6a12f;
            text-align: center;
        }
        .footer-policy {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .footer-policy a {
            color: #545454;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-policy a:hover {
            color: #d6a12f;
        }
        .footer-copyright {
            font-size: 0.8rem;
            color: #6b7b8c;
            margin-top: 0.5rem;
        }
        @media (max-width: 700px) {
            .footer-policy a { font-size: 0.85rem; }
            .policy-content h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html?reset=1" class="logo-area">
            <img src="/images/logo.png" alt="Logo" class="logo-small">
            <span class="brand-name" id="headerBrand">Nepal Law Group</span>
        </a>
        <!-- Desktop navigation -->
        <div class="nav-links" id="navLinks"></div>
        <!-- Hamburger button for mobile -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>

<!-- Mobile dropdown overlay -->
<div class="mobile-menu" id="mobileMenu">
    <div class="mobile-nav" id="mobileNav"></div>
</div>

<div class="main-content">
    <div class="policy-content" id="policyContent"></div>
</div>

<footer class="footer">
    <div class="footer-policy">
        <a href="terms.html" id="termsLink">Terms of Use</a>
        <a href="privacy.html" id="privacyLink">Privacy Policy</a>
        <a href="cookie.html" id="cookieLink">Cookie Policy</a>
    </div>
    <div class="footer-copyright" id="footerText">© 2026 Nepal Law Group – All rights reserved.</div>
</footer>

    const content = {

            htmlContent: `

                <p><strong>नेपाल ल ग्रुप (प्रस्तावित कम्पनी, कम्पनी ऐन, २०६३ अन्तर्गत अझै सम्मिलित नभएको)</strong></p>

                <h2>२. कानूनी सल्लाह वा वकील-ग्राहक सम्बन्धको अभाव</h2>
                <p>वेबसाइटको सामग्री केवल सूचनात्मक उद्देश्यका लागि हो। यसले कानूनी सल्लाह वा वकील-ग्राहक सम्बन्ध सिर्जना गर्दैन। कुनै पनि कानूनी कारबाही गर्नु अघि योग्य अधिवक्ताबाट सल्लाह लिनुहोस्।</p>
                <h2>३. योग्यता र प्रयोगकर्ताको आचरण</h2>
                <p>तपाईं १८ वर्ष वा सोभन्दा माथिको हुनुपर्छ। निषेधित आचरणमा अनधिकृत पहुँच, हानिकारक कोड पठाउने, दुर्व्यवहार, वा कम्पनीको प्रतिनिधिको रूप धारण गर्ने समावेश छ।</p>
                <h2>४. बौद्धिक सम्पत्ति अधिकार</h2>
                <p>वेबसाइटको सम्पूर्ण सामग्री कम्पनीको सम्पत्ति हो। तपाईंले व्यक्तिगत, गैर-व्यावसायिक प्रयोगको लागि मात्र सामग्री डाउनलोड वा छाप्न सक्नुहुन्छ। कुनै पनि पुनः प्रकाशन वा परिमार्जनको लागि पूर्व लिखित अनुमति आवश्यक छ।</p>
                <h2>५. सदस्यता आवेदन र जानकारी</h2>
                <p>वेबसाइटले सदस्यता बारे जानकारी प्रदान गर्दछ। आवेदनको माध्यमबाट स्वतः सदस्यता प्रदान हुँदैन।</p>
                <h2>६. अस्वीकारोक्ति र दायित्वको सीमा</h2>
                <p>वेबसाइट "जस्तो छ" प्रदान गरिन्छ। नेपालको कानूनले अनुमति दिएको अधिकतम सीमासम्म, कम्पनी कुनै पनि क्षतिको लागि उत्तरदायी हुनेछैन। कम्पनी दर्ता नभएको हुँदा कुनै पनि व्यक्तिगत सदस्य व्यक्तिगत रूपमा उत्तरदायी हुनेछैन।</p>
                <h2>७. तेस्रो पक्षको लिङ्क</h2>
                <p>हामी बाह्य वेबसाइटहरूको सामग्रीको लागि जिम्मेवार छैनौं।</p>
                <h2>८. गोपनीयता र डाटा संरक्षण</h2>
                <p>तपाईंको व्यक्तिगत जानकारी हाम्रो गोपनीयता नीति अनुसार व्यवस्थित गरिनेछ।</p>

                <p>यी सर्तहरू नेपालको कानूनद्वारा शासित हुनेछन्। विवादहरू काठमाडौं जिल्ला अदालतको अनन्य अधिकार क्षेत्रमा पेश गरिनेछन्।</p>
                <h2>१०. परिमार्जन र समाप्ति</h2>
                <p>कम्पनीले कुनै पनि समयमा वेबसाइटको भाग परिमार्जन वा बन्द गर्न सक्छ। उल्लङ्घनमा पहुँच समाप्त हुन सक्छ।</p>

        }
    };

    let currentLang = localStorage.getItem("nlgLang") || "en";
    let mobileMenuOpen = false;

    function updateUI(lang) {
        const d = content[lang];
        document.getElementById("headerBrand").innerText = d.headerBrand;
        // Desktop nav
        const navContainer = document.getElementById("navLinks");
        navContainer.innerHTML = `
            <a href="index.html?reset=1">${d.navHome}</a>
            <a href="about.html">${d.navAbout}</a>
            <a href="membership.html">${d.navMembership}</a>
            <a href="contact.html">${d.navContact}</a>
        `;
        // Mobile nav
        const mobileNavContainer = document.getElementById("mobileNav");
        mobileNavContainer.innerHTML = `
            <a href="index.html?reset=1">${d.navHome}</a>
            <a href="about.html">${d.navAbout}</a>
            <a href="membership.html">${d.navMembership}</a>
            <a href="contact.html">${d.navContact}</a>
        `;
        document.getElementById("termsLink").innerText = d.termsText;
        document.getElementById("privacyLink").innerText = d.privacyText;
        document.getElementById("cookieLink").innerText = d.cookieText;
        document.getElementById("footerText").innerHTML = d.footerText;
        document.getElementById("policyContent").innerHTML = d.htmlContent;
        // Mark current page active
        document.querySelectorAll("#navLinks a, #mobileNav a").forEach(link => {
            if (link.getAttribute("href") === "terms.html") link.classList.add("active");
            else link.classList.remove("active");
        });
        localStorage.setItem("nlgLang", lang);
    }

    // Mobile menu toggle
    const hamburger = document.getElementById("hamburgerBtn");
    const mobileMenu = document.getElementById("mobileMenu");
    function toggleMobileMenu() {
        if (mobileMenuOpen) {
            mobileMenu.classList.remove("active");
        } else {
            mobileMenu.classList.add("active");
        }
        mobileMenuOpen = !mobileMenuOpen;
    }
    mobileMenu.addEventListener("click", (e) => {
        if (e.target.tagName === "A") {
            toggleMobileMenu();
        }
    });
    mobileMenu.addEventListener("click", (e) => {
        if (e.target === mobileMenu) {
            toggleMobileMenu();
        }
    });
    hamburger.addEventListener("click", toggleMobileMenu);

    updateUI(currentLang);
</script>
</body>
</html>
